# CarPi5 Cockpit Acoustic Echo Cancellation (AEC) & Noise Suppression Filter-Chain
# Automatically creates CarPi-Clean-Voice-Source and CarPi-Master-Sink.
# Routes speaker reference playback directly into WebRTC AEC3 to subtract car stereo bleed.

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.description = "CarPi5 Acoustic Echo Cancel Source"
            source.props = {
                node.name = "CarPi-Clean-Voice-Source"
                node.description = "CarPi5 Clean Echo-Cancelled USB Microphone"
                media.class = "Audio/Source"
                audio.rate = 16000
                audio.channels = 1
                audio.position = [ MONO ]
            }
            sink.props = {
                node.name = "CarPi-Master-Sink"
                node.description = "CarPi5 In-Dash Automotive Master Audio Sink"
                media.class = "Audio/Sink"
                audio.rate = 48000
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            aec.args = {
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
                webrtc.noise_suppression = true
                webrtc.noise_suppression_level = 3
                webrtc.high_pass_filter = true
                webrtc.gain_control = true
            }
        }
    }
]
